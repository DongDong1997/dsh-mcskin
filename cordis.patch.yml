# dsh-mcskin bundle patch.
#
# Registers a top-level browser-side plugin row so the web-app bundle's
# `modules` plugin (see `packages/bundle/web-app/cordis.patch.yml`) picks
# it up at boot and composes it into `window.__DSH_BOOT__`.
#
# IMPORTANT: the `- insert:` wrapper is REQUIRED for dshmarket's hot-mount
# parser (parseSimplePatch in dshmarket/src/hot.ts). The bare `- id:` form
# is the standard bundle-layer format but dshmarket rejects it as
# config/expression rows, so the marketplace keeps demanding a restart.
# Without the wrapper, hot-mount never works and the plugin loads only
# via the bundle layer on a cold DSH restart.
#
# RENAME `name` below to your scoped npm package name before publishing.

- insert:
  - id: dsh-mcskin
    name: 'dsh-mcskin'
